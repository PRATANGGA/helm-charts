name: Store Helm Template to R2 service cloudflare
on:
  push:
    tags:
      - "v*"
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event_name }} event triggered this job"
      - run: echo "================================================="
      - name: Checking out the repository code
        uses: actions/checkout@v4
      - name: Setup Helm 
        run: sudo apt-get update -y && sudo apt-get install curl apt-transport-https --yes
      - name: Add helm repo into sourcelist apt
        run: curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | sudo tee /usr/share/keyrings/helm.gpg > /dev/null | echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | sudo tee /etc/apt/sources.list.d/helm-stable-debian.list
      - name: Update APT and install helm 
        run: sudo apt-get update -y && sudo apt-get install helm

  test-helm:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Check helm version 
        run: echo "=================================================="
      - name: Run Helm version
        run: helm version

  helm-create-package:
    runs-on: ubuntu-latest
    needs: test-helm
    steps:
      - name: Create helm repo 
        run: helm package helm-charts 

  push-on-R2:
    runs-on: ubuntu-latest
    needs: helm-create-package
    steps:
      - name: Install AWS cli
        run: sudo apt update -y && sudo apt install awscli
      - name: Configure AWS cli for Cloudflare R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_access_key "$R2_ACCESS_KEY"
      - name: Pre upload to R2
        run: | 
          VERSION="${GITHUB_REF}"
          PACKAGE_FILE="$(ls *.tgz)"
          echo "Uploading $PACKAGE_FILE as main-app-$VERSION.tgz"
      - name: Upload to R2 services
        run:  aws s3 cp "$PACKAGE_FILE" "s3://$R2_BUCKET_NAME/main-app-$VERSION.tgz" --endpoint-url https://3745d3c282b14278c8ab6cbe319b42ef.r2.cloudflarestorage.com






          
  





        


        



